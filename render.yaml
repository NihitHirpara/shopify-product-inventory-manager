services:
  - type: web
    name: shopify-product-inventory-manager
    runtime: node
    plan: free
    buildCommand: npm install && npm run setup && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,write_products,read_inventory,write_inventory,read_locations
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
